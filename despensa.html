<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Despensa</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#f5f4f0; --card:#ffffff; --line:#e4e1d8; --text:#2c2c2a; --muted:#6f6d64;
    --accent:#0f6e56; --accent-bg:#e1f5ee; --danger:#a32d2d; --danger-bg:#fcebeb;
    --warn:#854f0b; --warn-bg:#faeeda;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{position:sticky;top:0;background:var(--bg);padding:16px 16px 8px;z-index:5;}
  h1{font-size:20px;font-weight:600;margin:0 0 12px;}
  .tabs{display:flex;gap:8px;margin-bottom:8px;}
  .tab{flex:1;padding:12px;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:600;color:var(--muted);}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  main{padding:0 16px 100px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .name{font-size:16px;font-weight:600;}
  .meta{font-size:13px;color:var(--muted);margin-top:2px;}
  .qty{font-size:20px;font-weight:700;min-width:40px;text-align:center;}
  .btn{border:none;border-radius:8px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer;}
  .btn-round{width:38px;height:38px;border-radius:50%;font-size:20px;line-height:1;padding:0;}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn-danger{background:var(--danger);color:#fff;}
  .fab{position:fixed;bottom:20px;right:16px;left:16px;display:flex;gap:10px;z-index:10;}
  .fab .btn{flex:1;padding:16px;font-size:16px;border-radius:14px;}
  .badge{display:inline-block;font-size:12px;padding:3px 8px;border-radius:6px;font-weight:600;}
  .badge-warn{background:var(--warn-bg);color:var(--warn);}
  .badge-danger{background:var(--danger-bg);color:var(--danger);}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px;}
  #scanner-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:50;display:none;flex-direction:column;}
  #scanner-overlay.open{display:flex;}
  #reader{width:100%;max-width:420px;margin:auto;}
  .scan-header{display:flex;justify-content:space-between;align-items:center;padding:16px;color:#fff;}
  .scan-header .btn{background:#fff;color:#000;}
  #scan-status{color:#fff;text-align:center;padding:8px 16px;font-size:14px;min-height:20px;}
  #modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:60;display:none;align-items:flex-end;}
  #modal-overlay.open{display:flex;}
  #modal{background:var(--card);width:100%;border-radius:16px 16px 0 0;padding:20px;max-height:80vh;overflow:auto;}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;}
  input,select{width:100%;height:42px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:15px;background:#fff;color:var(--text);}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions .btn{flex:1;}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
</style>
</head>
<body>
<h2 class="sr-only">Aplicación de inventario de despensa con escaneo de código de barras, lista de compras y control de stock.</h2>

<div id="auth-overlay" style="position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="width:100%;max-width:360px;">
    <h1 style="text-align:center;margin-bottom:20px;">Mi despensa</h1>
    <div id="auth-status" class="meta" style="text-align:center;margin-bottom:10px;min-height:18px;"></div>
    <label>Correo</label>
    <input id="auth-email" type="email" placeholder="tu@correo.com">
    <label>Contraseña</label>
    <input id="auth-password" type="password" placeholder="Mínimo 6 caracteres">
    <div class="modal-actions">
      <button class="btn btn-outline" id="auth-signup">Crear cuenta</button>
      <button class="btn btn-accent" id="auth-login">Ingresar</button>
    </div>
  </div>
</div>

<div id="app-root" style="display:none;">
<header>
  <h1>Mi despensa</h1>
  <div class="tabs">
    <div class="tab active" data-tab="inv">Inventario</div>
    <div class="tab" data-tab="compras">Lista de compras</div>
  </div>
  <div class="row" style="gap:8px;margin-top:8px;">
    <button class="btn btn-outline" id="btn-export" style="flex:1;font-size:13px;padding:8px;">⬇️ Exportar respaldo</button>
    <button class="btn btn-outline" id="btn-import" style="flex:1;font-size:13px;padding:8px;">⬆️ Importar respaldo</button>
    <input type="file" id="import-input" accept="application/json" style="display:none;">
  </div>
  <div class="row" style="gap:8px;margin-top:8px;">
    <div class="meta" id="auth-user-label" style="flex:1;"></div>
    <button class="btn btn-outline" id="btn-logout" style="font-size:12px;padding:6px 10px;">Cerrar sesión</button>
  </div>
</header>

<main id="content"></main>

<div class="fab">
  <button class="btn btn-outline" id="btn-add-manual">+ Agregar manual</button>
  <button class="btn btn-accent" id="btn-scan">📷 Escanear</button>
</div>

<div id="scanner-overlay">
  <div class="scan-header">
    <span id="scan-mode-label" style="font-weight:600;">Escanear: sacar 1</span>
    <div style="display:flex;gap:8px;">
      <button class="btn" id="btn-flip-cam" title="Cambiar cámara">🔄 Cámara</button>
      <button class="btn" id="btn-close-scan">Cerrar</button>
    </div>
  </div>
  <div id="reader"></div>
  <div id="scan-status"></div>
  <div id="scan-bottom-actions" style="padding:16px;display:none;"></div>
</div>

<div id="modal-overlay">
  <div id="modal"></div>
</div>
</div>

<script>
const SUPABASE_URL = 'https://vunzglostcikazoybhma.supabase.co';
const SUPABASE_KEY = 'sb_publishable_tkfiLjI5i1OZo-lTUoSrxw_HszY7r7Z';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const STORE_KEY = 'inventario';
let items = {};
let currentTab = 'inv';
let html5QrCode = null;
let pendingBarcode = null;
let useFrontCamera = (localStorage.getItem('camPref') === 'front');
let scanContinuousMode = null; // 'in' | null
let barcodeScanCallback = null; // when set, scanning fills a field instead of normal logic
let realtimeChannel = null;

function rowToItem(r){
  return { id:r.id, name:r.name, qty:r.qty||0, min:r.min||0, target:r.target||1,
    barcode:r.barcode||null, wanted:!!r.wanted, wantedQty:r.wanted_qty||null, pendingStore:r.pending_store||null };
}
function itemToRow(it){
  return { id:it.id, name:it.name, qty:it.qty||0, min:it.min||0, target:it.target||1,
    barcode:it.barcode||null, wanted:!!it.wanted, wanted_qty:it.wantedQty||null,
    pending_store:it.pendingStore||null, updated_at:new Date().toISOString() };
}

async function syncToCloud(){
  const rows = Object.values(items).map(itemToRow);
  if(rows.length===0) return;
  try{ await supabaseClient.from('despensa_items').upsert(rows); }
  catch(e){ console.error('sync error', e); }
}
async function deleteFromCloud(id){
  try{ await supabaseClient.from('despensa_items').delete().eq('id', id); }
  catch(e){ console.error('delete sync error', e); }
}

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    items = raw ? JSON.parse(raw) : {};
  }catch(e){ items = {}; }
  render();
  refreshFromCloud();
}
async function refreshFromCloud(){
  try{
    const { data, error } = await supabaseClient.from('despensa_items').select('*');
    if(!error && data){
      items = {};
      data.forEach(r=>{ items[r.id] = rowToItem(r); });
      localStorage.setItem(STORE_KEY, JSON.stringify(items));
      render();
    }
  }catch(e){ console.error('refresh error', e); }
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(items)); }
  catch(e){ console.error('storage error', e); }
  syncToCloud();
}

function startRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = supabaseClient.channel('despensa_items_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'despensa_items' }, ()=>{
      refreshFromCloud();
    })
    .subscribe();
}

function showApp(session){
  document.getElementById('auth-overlay').style.display = 'none';
  document.getElementById('app-root').style.display = 'block';
  document.getElementById('auth-user-label').textContent = session.user.email;
  startRealtime();
  load();
}
function showAuth(){
  document.getElementById('auth-overlay').style.display = 'flex';
  document.getElementById('app-root').style.display = 'none';
}

document.getElementById('auth-login').addEventListener('click', async ()=>{
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const statusEl = document.getElementById('auth-status');
  statusEl.textContent = 'Ingresando...';
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error){ statusEl.textContent = 'Correo o contraseña incorrectos.'; }
});
document.getElementById('auth-signup').addEventListener('click', async ()=>{
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const statusEl = document.getElementById('auth-status');
  if(password.length < 6){ statusEl.textContent = 'La contraseña debe tener al menos 6 caracteres.'; return; }
  statusEl.textContent = 'Creando cuenta...';
  const { error } = await supabaseClient.auth.signUp({ email, password });
  if(error){ statusEl.textContent = error.message; }
  else{ statusEl.textContent = 'Cuenta creada. Si pide confirmación, revisa tu correo; si no, ya puedes ingresar.'; }
});
document.getElementById('btn-logout').addEventListener('click', async ()=>{
  await supabaseClient.auth.signOut();
});

supabaseClient.auth.onAuthStateChange((event, session)=>{
  if(session){ showApp(session); }
  else{ showAuth(); }
});
supabaseClient.auth.getSession().then(({ data })=>{
  if(data.session){ showApp(data.session); } else { showAuth(); }
});

function render(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===currentTab));
  const c = document.getElementById('content');
  const list = Object.values(items);
  if(currentTab==='inv'){
    if(list.length===0){ c.innerHTML = '<div class="empty">Sin productos todavía.<br>Agrega uno manual o escanea un código.</div>'; return; }
    list.sort((a,b)=>a.name.localeCompare(b.name));
    c.innerHTML = list.map(it=>{
      const low = it.qty<=it.min;
      return `<div class="card">
        <div class="row">
          <div onclick="editItem('${it.id}')" style="cursor:pointer;">
            <div class="name">${esc(it.name)} ✏️</div>
            <div class="meta">Mínimo: ${it.min}${it.barcode?' · código: '+esc(it.barcode):''} ${low?'<span class="badge badge-danger">bajo stock</span>':''}</div>
          </div>
          <div class="row" style="gap:8px;">
            <button class="btn btn-round btn-outline" onclick="changeQty('${it.id}',-1)">–</button>
            <div class="qty">${it.qty}</div>
            <button class="btn btn-round btn-outline" onclick="changeQty('${it.id}',1)">+</button>
          </div>
        </div>
      </div>`;
    }).join('');
  } else {
    const need = list.filter(it=>(it.qty<=it.min || it.wanted) && !it.pendingStore);
    const pending = list.filter(it=>it.pendingStore);
    c.innerHTML =
      (pending.length>0 ? `<div class="row" style="margin-bottom:6px;">
          <div class="meta" style="font-weight:600;">Compradas, por guardar en la despensa</div>
          <button class="btn btn-outline" id="btn-clear-pending" style="font-size:12px;padding:6px 10px;">🧹 Limpiar todo</button>
        </div>` +
        pending.sort((a,b)=>a.name.localeCompare(b.name)).map(it=>`<div class="card" style="border-color:var(--accent);">
          <div class="row">
            <div>
              <div class="name">${esc(it.name)}</div>
              <div class="meta">Compraste ${it.pendingStore}${it.barcode?' · escanéalo para guardar rápido':''}</div>
            </div>
            <button class="btn btn-accent" onclick="markStored('${it.id}')">Guardado</button>
          </div>
        </div>`).join('') + `<div style="height:14px;"></div>` : '') +
      `<div class="row" style="gap:8px;margin-bottom:10px;">
        <button class="btn btn-outline" id="btn-add-to-list" style="flex:1;">+ Agregar algo</button>
        ${need.length>0?'<button class="btn btn-accent" id="btn-share-list" style="flex:1;">📤 Compartir</button>':''}
      </div>` +
      (need.length===0 && pending.length===0 ? '<div class="empty">Nada por comprar por ahora.</div>' :
      need.sort((a,b)=>a.name.localeCompare(b.name)).map(it=>{
        const suggested = it.wantedQty ? it.wantedQty : Math.max(1, (it.target || it.min || 1) - it.qty);
        return `<div class="card">
      <div class="row">
        <div>
          <div class="name">${esc(it.name)}</div>
          <div class="meta">Tienes ${it.qty}, mínimo ${it.min} · comprar ~${suggested}${(it.wanted && it.qty>it.min)?' · agregado a mano':''}</div>
        </div>
        <button class="btn btn-accent" onclick="restock('${it.id}')">Comprado</button>
      </div>
    </div>`;
      }).join(''));
    const addBtn = document.getElementById('btn-add-to-list');
    if(addBtn) addBtn.addEventListener('click', showAddToListForm);
    const shareBtn = document.getElementById('btn-share-list');
    if(shareBtn) shareBtn.addEventListener('click', ()=> shareList(need));
    const clearBtn = document.getElementById('btn-clear-pending');
    if(clearBtn) clearBtn.addEventListener('click', ()=>{
      if(confirm('¿Descartar todas las compras pendientes de guardar? No se sumarán al inventario.')){
        pending.forEach(it=>{ it.pendingStore = null; });
        save(); render();
      }
    });
  }
}

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function stepperHtml(id, value){
  return `<div class="row" style="gap:12px;justify-content:center;margin:6px 0;">
    <button type="button" class="btn btn-round btn-outline stepper-minus" data-target="${id}" style="width:44px;height:44px;font-size:22px;">–</button>
    <div class="qty" id="${id}" data-val="${value}" style="font-size:24px;min-width:50px;">${value}</div>
    <button type="button" class="btn btn-round btn-outline stepper-plus" data-target="${id}" style="width:44px;height:44px;font-size:22px;">+</button>
  </div>`;
}
function bindSteppers(root){
  root.querySelectorAll('.stepper-minus').forEach(b=>{
    b.addEventListener('click', ()=>{
      const el = document.getElementById(b.dataset.target);
      const v = Math.max(0, parseInt(el.dataset.val)-1);
      el.dataset.val = v; el.textContent = v;
    });
  });
  root.querySelectorAll('.stepper-plus').forEach(b=>{
    b.addEventListener('click', ()=>{
      const el = document.getElementById(b.dataset.target);
      const v = parseInt(el.dataset.val)+1;
      el.dataset.val = v; el.textContent = v;
    });
  });
}
function stepperVal(id){
  const el = document.getElementById(id);
  return el ? parseInt(el.dataset.val)||0 : 0;
}

async function shareList(need){
  const text = 'Lista de compras:\n' + need.map(it=>{
    const suggested = it.wantedQty ? it.wantedQty : Math.max(1, (it.target || it.min || 1) - it.qty);
    return `- ${it.name} (x${suggested})`;
  }).join('\n');
  if(navigator.share){
    try{ await navigator.share({ title: 'Lista de compras', text }); }
    catch(e){ /* usuario canceló */ }
  } else {
    try{
      await navigator.clipboard.writeText(text);
      alert('Lista copiada al portapapeles (tu navegador no soporta compartir directo).');
    }catch(e){
      alert(text);
    }
  }
}

window.changeQty = function(id, delta){
  const it = items[id];
  if(!it) return;
  it.qty = Math.max(0, it.qty + delta);
  save(); render();
}
window.editItem = function(id){
  const it = items[id];
  if(!it) return;
  openModal(`
    <label>Nombre del producto</label>
    <input id="e-name" value="${esc(it.name)}">
    <label>Cantidad actual</label>
    ${stepperHtml('e-qty', it.qty)}
    <label>Mínimo antes de reponer</label>
    ${stepperHtml('e-min', it.min)}
    <label>Stock objetivo (cuánto tener después de comprar)</label>
    ${stepperHtml('e-target', it.target || it.min || 1)}
    <label>Código de barras</label>
    <div class="row" style="gap:8px;">
      <input id="e-barcode" value="${it.barcode?esc(it.barcode):''}" placeholder="Sin código todavía" style="flex:1;">
      <button type="button" class="btn btn-outline" id="e-scan-barcode" style="white-space:nowrap;">📷 Leer</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="e-delete">Eliminar producto</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-accent" id="e-save">Guardar</button>
    </div>
  `);
  bindSteppers(document.getElementById('modal'));
  document.getElementById('e-scan-barcode').addEventListener('click', ()=>{
    scanBarcodeInto('e-barcode', ()=> editItem(id));
  });
  document.getElementById('e-save').addEventListener('click', ()=>{
    const name = document.getElementById('e-name').value.trim();
    const errEl = document.getElementById('e-name');
    if(!name){ errEl.style.borderColor = 'var(--danger)'; return; }
    const newBarcode = document.getElementById('e-barcode').value.trim() || null;
    it.name = name;
    it.qty = stepperVal('e-qty');
    it.min = stepperVal('e-min');
    it.target = Math.max(it.min, stepperVal('e-target'));
    if(newBarcode !== it.barcode){
      if(newBarcode && items[newBarcode] && newBarcode !== id){
        alert('Ese código de barras ya está siendo usado por otro producto.');
        return;
      }
      const oldId = id;
      it.barcode = newBarcode;
      if(newBarcode && oldId !== newBarcode){
        delete items[oldId];
        items[newBarcode] = it;
        it.id = newBarcode;
        deleteFromCloud(oldId);
      }
    }
    save(); closeModal(); render();
  });
  document.getElementById('e-delete').addEventListener('click', ()=>{
    if(confirm(`¿Eliminar "${it.name}" del inventario?`)){
      delete items[id];
      save(); deleteFromCloud(id); closeModal(); render();
    }
  });
}
window.restock = function(id){
  const it = items[id];
  if(!it) return;
  const suggested = it.wantedQty ? it.wantedQty : Math.max(1, (it.target || it.min || 1) - it.qty);
  openModal(`
    <label>¿Cuánto compraste de "${esc(it.name)}"?</label>
    ${stepperHtml('f-restock-qty', suggested)}
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-accent" id="f-restock-save">Guardar</button>
    </div>
  `);
  bindSteppers(document.getElementById('modal'));
  document.getElementById('f-restock-save').addEventListener('click', ()=>{
    const addQty = stepperVal('f-restock-qty');
    it.pendingStore = addQty;
    it.wanted = false;
    it.wantedQty = null;
    save(); closeModal(); render();
  });
}
window.markStored = function(id){
  const it = items[id];
  if(!it || !it.pendingStore) return;
  it.qty += it.pendingStore;
  it.pendingStore = null;
  save(); render();
}

function showAddToListForm(){
  const existing = Object.values(items).filter(it=>!(it.qty<=it.min || it.wanted));
  openModal(`
    <label>¿Ya existe en tu inventario?</label>
    <select id="atl-existing">
      <option value="">-- Elegir producto existente --</option>
      ${existing.map(it=>`<option value="${it.id}">${esc(it.name)}</option>`).join('')}
    </select>
    <div class="meta" style="margin:10px 0;text-align:center;">— o crea uno nuevo —</div>
    <label>Nombre del producto nuevo</label>
    <input id="atl-name" placeholder="Ej: velas para cumpleaños">
    <label>¿Cuántos quieres comprar?</label>
    ${stepperHtml('atl-qty', 1)}
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-accent" id="atl-save">Agregar a la lista</button>
    </div>
  `);
  bindSteppers(document.getElementById('modal'));
  document.getElementById('atl-save').addEventListener('click', ()=>{
    const existingId = document.getElementById('atl-existing').value;
    const newName = document.getElementById('atl-name').value.trim();
    const wantQty = Math.max(1, stepperVal('atl-qty'));
    if(existingId){
      items[existingId].wanted = true;
      items[existingId].wantedQty = wantQty;
    } else if(newName){
      const id = 'm_'+Date.now();
      items[id] = { id, name: newName, qty: 0, min: 0, target: wantQty, wanted: true, wantedQty: wantQty, barcode: null };
    } else {
      return;
    }
    save(); closeModal(); render();
  });
}

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{ currentTab = t.dataset.tab; render(); });
});

function openModal(html){
  document.getElementById('modal').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
}
document.getElementById('modal-overlay').addEventListener('click', e=>{
  if(e.target.id==='modal-overlay') closeModal();
});

document.getElementById('btn-add-manual').addEventListener('click', ()=> showItemForm(null));

function showItemForm(barcode){
  openModal(`
    <div id="lookup-status" class="meta" style="margin-bottom:6px;"></div>
    <label>Nombre del producto</label>
    <input id="f-name" placeholder="Arroz, aceite, leche...">
    <label>Cantidad inicial</label>
    ${stepperHtml('f-qty', 1)}
    <label>Mínimo antes de reponer</label>
    ${stepperHtml('f-min', 1)}
    <label>Stock objetivo (cuánto tener después de comprar)</label>
    ${stepperHtml('f-target', 1)}
    ${barcode?`<div class="meta" style="margin-top:8px;">Código escaneado: ${esc(barcode)}</div>`:''}
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-accent" id="f-save">Guardar</button>
    </div>
  `);
  bindSteppers(document.getElementById('modal'));
  document.getElementById('f-save').addEventListener('click', ()=>{
    const name = document.getElementById('f-name').value.trim();
    const errEl = document.getElementById('f-name');
    if(!name){ errEl.style.borderColor = 'var(--danger)'; return; }
    const qty = stepperVal('f-qty');
    const min = stepperVal('f-min');
    const target = Math.max(min, stepperVal('f-target'));
    const id = barcode || ('m_'+Date.now());
    items[id] = { id, name, qty, min, target, barcode: barcode||null };
    save(); closeModal(); currentTab='inv'; render();
  });

  if(barcode){
    lookupBarcode(barcode);
  }
}

async function lookupBarcode(barcode){
  const statusEl = document.getElementById('lookup-status');
  if(!statusEl) return;
  statusEl.textContent = 'Buscando producto...';
  try{
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(barcode)}.json`);
    const data = await res.json();
    if(data && data.status===1 && data.product){
      const p = data.product;
      const suggested = [p.product_name, p.brands].filter(Boolean).join(' - ');
      if(suggested){
        const nameInput = document.getElementById('f-name');
        if(nameInput){ nameInput.value = suggested; }
        statusEl.textContent = 'Producto encontrado, revisa el nombre sugerido.';
        return;
      }
    }
    statusEl.textContent = 'No se encontró en la base de datos. Escribe el nombre manual (puedes pegarlo si lo copiaste con la cámara del teléfono).';
  }catch(e){
    statusEl.textContent = 'No se pudo buscar el producto (sin conexión). Escribe el nombre manual.';
  }
}

document.getElementById('btn-scan').addEventListener('click', ()=>{ scanContinuousMode = null; startScan('out'); });
document.getElementById('btn-close-scan').addEventListener('click', ()=>{ scanContinuousMode = null; stopScan(); });
document.getElementById('btn-flip-cam').addEventListener('click', async ()=>{
  useFrontCamera = !useFrontCamera;
  localStorage.setItem('camPref', useFrontCamera ? 'front' : 'back');
  if(html5QrCode){ try{ await html5QrCode.stop(); html5QrCode.clear(); }catch(e){} html5QrCode=null; }
  startScan(scanContinuousMode || 'out');
});

async function startScan(mode){
  document.getElementById('scan-mode-label').textContent = mode==='in' ? 'Modo ingresar (compra) — sigue escaneando' : 'Escanear producto';
  document.getElementById('scanner-overlay').classList.add('open');
  document.getElementById('scan-status').textContent = useFrontCamera ? 'Cámara delantera' : 'Cámara trasera';
  const bottomActions = document.getElementById('scan-bottom-actions');
  if(mode==='in'){
    bottomActions.style.display = 'block';
    bottomActions.innerHTML = `<button class="btn btn-accent" id="btn-end-in" style="width:100%;padding:16px;font-size:16px;">✅ Fin ingreso</button>`;
    document.getElementById('btn-end-in').addEventListener('click', ()=>{
      scanContinuousMode = null;
      stopScan();
    });
  } else {
    bottomActions.style.display = 'none';
    bottomActions.innerHTML = '';
  }
  html5QrCode = new Html5Qrcode('reader');
  try{
    await html5QrCode.start(
      { facingMode: useFrontCamera ? 'user' : 'environment' },
      { fps: 10, qrbox: { width: 250, height: 150 } },
      onScanSuccess,
      ()=>{}
    );
    const videoEl = document.querySelector('#reader video');
    if(videoEl){ videoEl.style.transform = useFrontCamera ? 'scaleX(-1)' : 'none'; }
  }catch(e){
    document.getElementById('scan-status').textContent = 'No se pudo abrir esa cámara. Prueba con la otra usando el botón 🔄.';
  }
}
async function stopScan(){
  document.getElementById('scanner-overlay').classList.remove('open');
  document.getElementById('scan-bottom-actions').style.display = 'none';
  if(html5QrCode){ try{ await html5QrCode.stop(); html5QrCode.clear(); }catch(e){} html5QrCode=null; }
}

function scanBarcodeInto(fieldId, reopenCallback){
  closeModal();
  barcodeScanCallback = (code)=>{
    if(items[code]){
      alert('Ese código de barras ya está siendo usado por otro producto.');
      reopenCallback();
      return;
    }
    reopenCallback();
    const input = document.getElementById(fieldId);
    if(input) input.value = code;
  };
  scanContinuousMode = null;
  startScan('out');
}

async function onScanSuccess(decodedText){
  if(pendingBarcode===decodedText) return;
  pendingBarcode = decodedText;

  if(barcodeScanCallback){
    await stopScan();
    const cb = barcodeScanCallback;
    barcodeScanCallback = null;
    pendingBarcode = null;
    cb(decodedText);
    return;
  }

  const it = items[decodedText];
  if(it){
    await stopScan();
    let qtyVal = 1;
    const renderModal = ()=>{
      openModal(`
        <label>${esc(it.name)}</label>
        <div class="meta">Tienes ${it.qty} ahora.</div>
        ${it.pendingStore ? `
        <div class="card" style="border-color:var(--accent);margin:10px 0;">
          <div class="row">
            <div class="meta">Compraste ${it.pendingStore}, pendiente de guardar</div>
            <button class="btn btn-accent" id="scan-mark-stored">Guardar compra</button>
          </div>
        </div>` : ''}
        <label>Cantidad</label>
        <div class="row" style="gap:12px;justify-content:center;margin:10px 0;">
          <button class="btn btn-round btn-outline" id="scan-qty-minus" style="width:52px;height:52px;font-size:26px;">–</button>
          <div class="qty" id="scan-qty-display" style="font-size:28px;min-width:50px;">${qtyVal}</div>
          <button class="btn btn-round btn-outline" id="scan-qty-plus" style="width:52px;height:52px;font-size:26px;">+</button>
        </div>
        <div class="modal-actions">
          <button class="btn btn-danger" id="scan-out">Sacar</button>
          <button class="btn ${scanContinuousMode==='in'?'btn-accent':'btn-outline'}" id="scan-in">Ingresar (compra)</button>
        </div>
        <div class="modal-actions">
          <button class="btn btn-outline" id="scan-cancel" style="width:100%;">Cancelar</button>
        </div>
      `);
      if(it.pendingStore){
        document.getElementById('scan-mark-stored').addEventListener('click', ()=>{
          markStored(it.id);
          closeModal();
          pendingBarcode = null;
          if(scanContinuousMode==='in'){ startScan('in'); }
        });
      }
      document.getElementById('scan-qty-minus').addEventListener('click', ()=>{
        qtyVal = Math.max(1, qtyVal-1);
        document.getElementById('scan-qty-display').textContent = qtyVal;
      });
      document.getElementById('scan-qty-plus').addEventListener('click', ()=>{
        qtyVal += 1;
        document.getElementById('scan-qty-display').textContent = qtyVal;
      });
      document.getElementById('scan-out').addEventListener('click', ()=>{
        it.qty = Math.max(0, it.qty - qtyVal);
        scanContinuousMode = null;
        save(); closeModal(); render();
        pendingBarcode = null;
      });
      document.getElementById('scan-in').addEventListener('click', ()=>{
        it.qty += qtyVal;
        it.wanted = false;
        scanContinuousMode = 'in';
        save(); closeModal(); render();
        pendingBarcode = null;
        startScan('in');
      });
      document.getElementById('scan-cancel').addEventListener('click', ()=>{
        scanContinuousMode = null;
        closeModal();
        pendingBarcode = null;
      });
    };
    renderModal();
  } else {
    await stopScan();
    pendingBarcode = null;
    scanContinuousMode = null;
    showItemForm(decodedText);
  }
}

document.getElementById('btn-export').addEventListener('click', ()=>{
  const dataStr = JSON.stringify(items, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fecha = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `despensa-respaldo-${fecha}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById('btn-import').addEventListener('click', ()=>{
  document.getElementById('import-input').click();
});

document.getElementById('import-input').addEventListener('change', (e)=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      const count = Object.keys(parsed).length;
      openModal(`
        <label>Se encontraron ${count} productos en el archivo.</label>
        <div class="meta">Importar reemplazará todo tu inventario actual. Esta acción no se puede deshacer.</div>
        <div class="modal-actions">
          <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-danger" id="confirm-import">Reemplazar inventario</button>
        </div>
      `);
      document.getElementById('confirm-import').addEventListener('click', async ()=>{
        const oldIds = Object.keys(items);
        items = parsed;
        for(const oldId of oldIds){
          if(!items[oldId]) await deleteFromCloud(oldId);
        }
        save();
        closeModal();
        currentTab = 'inv';
        render();
      });
    }catch(err){
      alert('El archivo no es un respaldo válido.');
    }
    document.getElementById('import-input').value = '';
  };
  reader.readAsText(file);
});

</script>
